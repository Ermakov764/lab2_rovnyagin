# Профиль docker: внешняя БД — DBHOST, DBPORT, DBNAME, SCHEMANAME (см. docker-compose.yml / .env).
# В compose обычно задают SPRING_DATASOURCE_URL целиком; ниже — запасной шаблон, если задан только DBHOST.
spring.datasource.url=jdbc:postgresql://${DBHOST:localhost}:${DBPORT:5432}/${DBNAME:lab2_db}?currentSchema=${SCHEMANAME:public}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:lab2_password}
