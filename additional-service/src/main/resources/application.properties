# Порт процесса микросервиса (в Docker обычно переопределяют SERVER_PORT).
server.port=${SERVER_PORT:8081}

# Swagger UI (лаб. 14): только REST под /api/**
springdoc.paths-to-match=/api/**

# Базовый URL основного CRUD-приложения. CinemaCrudClient ходит на {base}/api/films и {base}/api/tickets.
# Без завершающего слэша (нормализация дублируется в MainCrudProperties.setBaseUrl).
main.crud.base-url=${MAIN_CRUD_BASE_URL:http://localhost:8080}

spring.application.name=lab8-additional-service
observability.windows=${OBSERVABILITY_WINDOWS:10s,30s,1m}
observability.tick-ms=${OBSERVABILITY_TICK_MS:1000}
observability.log-on-refresh=${OBSERVABILITY_LOG_ON_REFRESH:true}
observability.log-empty-snapshots=${OBSERVABILITY_LOG_EMPTY_SNAPSHOTS:false}

# TTL-кеш справочника фильмов в Additional: уменьшает число повторных GET /api/films к CRUD.
# TTL кеша фильмов в миллисекундах (по умолчанию 30000 = 30 с).

# Смысл: если кеш фильмов был обновлен меньше 30 секунд назад, additional-service берет фильмы из памяти. 
# Если прошло 30 секунд или больше, следующий запрос аналитики обновит фильмы через GET /api/films.
film-cache.ttl-ms=${FILM_CACHE_TTL_MS:30000}

# Периодическая статистика наполнения кеша по требованию лабораторной.
# Это период печати статистики кеша в логи. Сейчас по умолчанию 10000, то есть каждые 10 секунд.
film-cache.stats-rate-ms=${FILM_CACHE_STATS_RATE_MS:10000}
