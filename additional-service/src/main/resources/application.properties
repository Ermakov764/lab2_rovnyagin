# Порт процесса микросервиса (в Docker обычно переопределяют SERVER_PORT).
server.port=${SERVER_PORT:8081}

# Базовый URL основного CRUD-приложения. CinemaCrudClient ходит на {base}/api/films и {base}/api/tickets.
# Без завершающего слэша (нормализация дублируется в MainCrudProperties.setBaseUrl).
main.crud.base-url=${MAIN_CRUD_BASE_URL:http://localhost:8080}

spring.application.name=lab8-additional-service
observability.windows=${OBSERVABILITY_WINDOWS:10s,30s,1m}
observability.tick-ms=${OBSERVABILITY_TICK_MS:1000}
observability.log-on-refresh=${OBSERVABILITY_LOG_ON_REFRESH:true}
observability.log-empty-snapshots=${OBSERVABILITY_LOG_EMPTY_SNAPSHOTS:false}
