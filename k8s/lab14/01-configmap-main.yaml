apiVersion: v1
kind: ConfigMap
metadata:
  name: lab2-main-config
  namespace: hl3
data:
  SPRING_PROFILES_ACTIVE: "docker"
  # ТЗ: DB_HOST; приложение читает DBHOST (application-docker.properties).
  DB_HOST: "10.60.3.9"
  DBHOST: "10.60.3.9"
  DBPORT: "5433"
  DBNAME: "hl3"
  SCHEMANAME: "hl3"
  SPRING_DATASOURCE_USERNAME: "postgres"
  # ТЗ: KAFKA_HOSTS; Spring Kafka — KAFKA_BOOTSTRAP_SERVERS (порт как в docker-compose.hl12.yml).
  KAFKA_HOSTS: "10.60.3.12,10.60.3.13"
  KAFKA_BOOTSTRAP_SERVERS: "10.60.3.12:9094,10.60.3.13:9094"
  KAFKA_TOPIC: "hl3"
  KAFKA_LISTENER_CONCURRENCY: "1"
  KAFKA_CONSUMER_GROUP_ID: "lab2-main-k8s-hl3"
  # Внутренний ClusterIP сервиса доп. микросервиса (имя из 07-services.yaml).
  ADDITIONAL_SERVICE_BASE_URL: "http://lab2-additional:8081"
  SERVER_TOMCAT_THREADS_MAX: "80"
  SPRING_JPA_SHOW_SQL: "false"
  SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
  # Guaranteed Pod 1Gi: оставить запас под metaspace / native.
  JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
