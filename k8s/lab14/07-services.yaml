# Внутренний доступ: статистика -> основной CRUD (ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: lab2-main
  namespace: hl3
spec:
  type: ClusterIP
  selector:
    app: lab2-main
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Внешний доступ: Swagger UI основного сервиса (NodePort).
apiVersion: v1
kind: Service
metadata:
  name: lab2-main-nodeport
  namespace: hl3
spec:
  type: NodePort
  selector:
    app: lab2-main
  ports:
    - name: http
      port: 8080
      targetPort: http
      # При конфликте порта на кластере замените на свободный из диапазона 30000–32767.
      nodePort: 30303
---
# Внутренний доступ: основной -> доп. (ClusterIP).
apiVersion: v1
kind: Service
metadata:
  name: lab2-additional
  namespace: hl3
spec:
  type: ClusterIP
  selector:
    app: lab2-additional
  ports:
    - name: http
      port: 8081
      targetPort: http
---
# Внешний доступ: Swagger UI доп. сервиса (NodePort).
apiVersion: v1
kind: Service
metadata:
  name: lab2-additional-nodeport
  namespace: hl3
spec:
  type: NodePort
  selector:
    app: lab2-additional
  ports:
    - name: http
      port: 8081
      targetPort: http
      nodePort: 30304
