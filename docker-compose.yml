# CRUD (:8080) + Additional (:8081) + локальный PostgreSQL (сервис postgresdb).
# На ВМ: docker compose --env-file .env up -d
#
# Локально (как раньше): DBHOST=postgresdb — CRUD и БД в одной docker-сети.
# Внешняя БД (hl12 и т.д.): уберите сервис postgresdb и volumes, выставьте DBHOST на доступный хост.
#
# Лимиты CPU/RAM: cpus / mem_limit. crud-app ждёт healthy postgres и старт additional-app.

services:
  postgresdb:
    image: postgres:15-alpine
    container_name: lab2_postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=1000"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab2_password}
      POSTGRES_DB: ${POSTGRES_DB:-lab2_db}
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  additional-app:
    image: ${DOCKER_IMAGE_ADDITIONAL:-lavrentiyermakov/lab2_additional:latest}
    container_name: lab2_additional_app
    restart: unless-stopped
    ports:
      - "${ADDITIONAL_PUBLISH_PORT:-8081}:8081"
    environment:
      SERVER_PORT: "8081"
      MAIN_CRUD_BASE_URL: ${MAIN_CRUD_BASE_URL:-http://crud-app:8080}
      MAIN_CRUD_HTTP_CONNECT_TIMEOUT_MS: ${MAIN_CRUD_HTTP_CONNECT_TIMEOUT_MS:-120000}
      MAIN_CRUD_HTTP_READ_TIMEOUT_MS: ${MAIN_CRUD_HTTP_READ_TIMEOUT_MS:-180000}
      JAVA_TOOL_OPTIONS: ${ADDITIONAL_JAVA_TOOL_OPTIONS:-}
    cpus: "${ADDITIONAL_CPU_LIMIT:-0.5}"
    mem_limit: "${ADDITIONAL_MEMORY_LIMIT:-512m}"

  crud-app:
    image: ${DOCKER_IMAGE_APP:-lavrentiyermakov/lab2_rovnyagin:latest}
    container_name: lab2_crud_app
    restart: unless-stopped
    ports:
      - "${APP_PUBLISH_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://${DBHOST:-postgresdb}:${DBPORT:-5432}/${DBNAME:-lab2_db}?currentSchema=${SCHEMANAME:-public}
      DBHOST: ${DBHOST:-postgresdb}
      DBPORT: ${DBPORT:-5432}
      DBNAME: ${DBNAME:-${POSTGRES_DB:-lab2_db}}
      SCHEMANAME: ${SCHEMANAME:-public}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-lab2_password}
      SERVER_TOMCAT_THREADS_MAX: ${SERVER_TOMCAT_THREADS_MAX:-200}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL:-false}
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: ${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:-false}
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:-60}
      ADDITIONAL_SERVICE_BASE_URL: ${ADDITIONAL_SERVICE_BASE_URL:-http://additional-app:8081}
    depends_on:
      postgresdb:
        condition: service_healthy
      additional-app:
        condition: service_started
    cpus: "${APP_CPU_LIMIT:-1.50}"
    mem_limit: "${APP_MEMORY_LIMIT:-1536m}"

volumes:
  postgres_data:
